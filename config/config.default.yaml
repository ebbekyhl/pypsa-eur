# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#clustering
clustering:
  mode: busmap
  area_threshold: 1000 # km2
  single_node_regions: # force listed regions to have only one node
    - GBNI 
    - GBGL
  administrative:
    GB: 3
  focus_weights:
    GBCE: 0.057306 # Central England (weighting: 1 / N) # N corresponds to the sum of all numerators such that the sum of all weights is 1
    GBEM: 0.057306 # East Midlands (weighting: 1 / N)
    GBSC: 0.171919 # Scotland (weighting: 3 / N)
    GBNW: 0.057306 # North West (weighting: 1 / N)
    GBNE: 0.057306 # North East (weighting: 1 / N)
    GBWM: 0.057306 # West Midlands (weighting: 1 / N)
    GBEA: 0.057306 # East (weighting: 1 / N)
    GBSE: 0.057306 # South East (weighting: 1 / N)
    GBSW: 0.057306 # South West (weighting: 1 / N)
    GBCY: 0.057306 # Wales (weighting: 1 / N)
    GBGL: 0.057306 # Greater London (weighting: 1 / N)
    GBNI: 0.057306 # Northern Ireland (weighting: 1 / N)
    ES: 0.0744985 # Spain (weighting: 1.3 / N) 
    FR: 0.0744985 # France (weighting: 1.3 / N)
    DE: 0.0487106 # Germany (weighting: 0.85 / N)
  copperplate_regions: []
  build_bidding_zones:
    remove_islands: true
    aggregate_to_tyndp: false
  simplify_network:
    to_substations: false
    remove_stubs: true
    remove_stubs_across_borders: false
  cluster_network:
    algorithm: kmeans
    subregions:
      GB:
        geojson: "data/data_UK/RESP_regions.geojson"
        id_field: "name"                 # property/column in geojson features
        allocation_method: "load"        # "load" | "buses" | "equal"
        min_clusters_per_subregion: 1
        on_unassigned: "nearest"         # "nearest" | "error"
    hac_features:
    - wnd100m
    - influx_direct
  exclude_carriers: []
  consider_efficiency_classes: false
  aggregation_strategies:
    generators:
      committable: any
      ramp_limit_up: max
      ramp_limit_down: max
  temporal:
    resolution_elec: false
    resolution_sector: false

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#adjustments
adjustments:
  electricity: false
  sector:
    factor:
      Link:
        electricity distribution grid:
          capital_cost: 1.0
    absolute: false

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#solving
solving:
  options:
    clip_p_max_pu: 1.e-2
    load_shedding: false
    curtailment_mode: false
    noisy_costs: true
    skip_iterations: true
    rolling_horizon: false
    seed: 123
    custom_extra_functionality: "../data/custom_extra_functionality.py"
    # io_api: "direct"  # Increases performance but only supported for the highs and gurobi solvers
    # options that go into the optimize function
    track_iterations: false
    min_iterations: 2
    max_iterations: 3
    transmission_losses: 2
    linearized_unit_commitment: true
    horizon: 365
    post_discretization:
      enable: false
      line_unit_size: 1700
      line_threshold: 0.3
      link_unit_size:
        DC: 2000
        H2 pipeline: 1200
        gas pipeline: 1500
      link_threshold:
        DC: 0.3
        H2 pipeline: 0.3
        gas pipeline: 0.3
      fractional_last_unit_size: false
    keep_files: false
    model_kwargs:
      solver_dir: ""

  agg_p_nom_limits:
    agg_offwind: false
    agg_solar: false
    include_existing: false
    file: data/agg_p_nom_minmax.csv

  constraints:
    CCL: false
    EQ: false
    BAU: false
    SAFE: false

  solver:
    name: gurobi
    options: gurobi-default

  solver_options:
    highs-default:
      # refer to https://ergo-code.github.io/HiGHS/dev/options/definitions/
      threads: 1
      solver: "ipm"
      run_crossover: "off"
      small_matrix_value: 1e-6
      large_matrix_value: 1e9
      primal_feasibility_tolerance: 1e-5
      dual_feasibility_tolerance: 1e-5
      ipm_optimality_tolerance: 1e-4
      parallel: "on"
      random_seed: 123
    highs-simplex:
      solver: "simplex"
      parallel: "on"
      primal_feasibility_tolerance: 1e-5
      dual_feasibility_tolerance: 1e-5
      random_seed: 123
    gurobi-default:
      threads: 32
      method: 2 # barrier
      crossover: 0
      BarConvTol: 1.e-5
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
    gurobi-numeric-focus:
      NumericFocus: 3       # Favour numeric stability over speed
      method: 2             # barrier
      crossover: 0          # do not use crossover
      BarHomogeneous: 1     # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-4
      OptimalityTol: 1.e-4
      ObjScale: -0.5
      threads: 8
      Seed: 123
    gurobi-fallback:        # Use gurobi defaults
      crossover: 0
      method: 2             # barrier
      BarHomogeneous: 1     # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-5
      OptimalityTol: 1.e-5
      Seed: 123
      threads: 8
    cplex-default:
      threads: 4
      lpmethod: 4 # barrier
      solutiontype: 2 # non basic solution, ie no crossover
      barrier.convergetol: 1.e-5
      feasopt.tolerance: 1.e-6
    copt-default:
      Threads: 8
      LpMethod: 2
      Crossover: 0
      RelGap: 1.e-6
      Dualize: 0
    copt-gpu:
      LpMethod: 6
      GPUMode: 1
      PDLPTol: 1.e-5
      Crossover: 0
    cbc-default: {} # Used in CI
    glpk-default: {} # Used in CI

  check_objective:
    enable: false
    expected_value: None
    atol: 1_000_000
    rtol: 0.01

  mem_mb: 300000 # 110000 for 3-hourly fully sector-coupled
  memory_logging_frequency: 5 # in seconds
  runtime: 48h #runtime in humanfriendly style https://humanfriendly.readthedocs.io/en/latest/
