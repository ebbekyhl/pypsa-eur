    methanol_to_power: 
      ccgt: true # <------------------------------------------------------------------------------------ include or not?
      ccgt_cc: false # <------------------------------------------------------------------------------------ include or not?
      ocgt: true # <------------------------------------------------------------------------------------ include or not?
      allam: true # <------------------------------------------------------------------------------------ include or not?
    force_industry_heat: false
    biomass_to_methanol: true # <------------------------------------------------------------------------------------ include or not?
    biomass_to_methanol_cc: true # <------------------------------------------------------------------------------------ include or not?
    biogas_to_methanol: true # <------------------------------------------------------------------------------------ include or not?
  replace_medium_heat: false
  ammonia: true
  min_part_load_fischer_tropsch: 0.5
  min_part_load_methanolisation: 0.3
  min_part_load_methanation: 0.3
