# caps_continental_targets (Ct): one budget for all 33 countries equal, in each year, to the sum of the national caps of caps_national_targets, so that Nt minus Ct isolates the split of that budget into national caps.
# The caps are the national targets converted to the CO2 that PyPSA-Eur models (GHG allowed minus LULUCF,
# non-CO2 GHG and bunkers, as a fraction of 1990 CO2), copied on 15 Nov 2026 from
# config/local_co2_model_consistent.yaml (sources and arithmetic there); the literal targets are in
# config/local_co2.yaml. Everything else as in config/config_caps_continental.yaml. The run starts from the
# solved 2025 network of caps_continental (staged by job_x_install.sh / job_x_stage.sh).
run:
  name: "caps_continental_targets"
# International aviation and shipping are one account of all countries, as in
# config.caps.yaml. Each country brings to the account the share of its 1990 CO2 of
# the two sectors that its target gives it in that year, so the allowance [MtCO2/a] is
# the sum over the countries of that share (local_co2 below, 0.628 in 2025) times
# their 1990 CO2 of international aviation and navigation (182.2 Mt in all). The caps
# and the account then add up to the budget that the caps have with bunker fuel
# counted where it is sold (2,291.8 Mt in 2030): the account moves bunker CO2 between
# countries and leaves the total as it is. Recompute the values when the targets
# below change.
co2_bunkers: shared
co2_bunker_allowance: {unit: MtCO2, 2025: 114.426, 2030: 91.261, 2035: 54.225, 2040: 26.150, 2045: 11.726, 2050: 0.0}
