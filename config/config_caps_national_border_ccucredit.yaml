# caps_national_border_ccucredit: the border adjustment of caps_national_border
# without the border rules for carbon carriers and without the methanol split. With
# the clean/nonclean split, each country's cap also counts the nonclean-labelled
# electricity (0.35 tCO2/MWh) and hydrogen (0.422 tCO2/MWh_H2, the EU default for
# hydrogen) it imports from any other country; the exporter still counts its own
# emissions (no credit). No CBAM charge. National caps from 2030 only; the run starts from the solved 2025 network of
# caps_continental (staged by job_x_stage.sh). The 2030 brownfield collapses
# the split, a no-op on that unsplit network. Run it on top of config.caps.yaml,
# which holds the split settings.
run:
  name: "caps_national_border_ccucredit"
local_co2:
  AL: &caps {2030: 0.45, 2035: 0.25, 2040: 0.10, 2045: 0.05, 2050: 0.0}
  AT: *caps
  BA: *caps
  BE: *caps
  BG: *caps
  CH: *caps
  CZ: *caps
  DE: *caps
  DK: *caps
  EE: *caps
  ES: *caps
  FI: *caps
  FR: *caps
  GB: *caps
  GR: *caps
  HR: *caps
  HU: *caps
  IE: *caps
  IT: *caps
  LT: *caps
  LU: *caps
  LV: *caps
  ME: *caps
  MK: *caps
  NL: *caps
  'NO': *caps
  PL: *caps
  PT: *caps
  RO: *caps
  RS: *caps
  SE: *caps
  SI: *caps
  SK: *caps
uk_settings:
  prepare:
    cbam: true
    cbam_emission_transfer: import_only_all
    cbam_transfer_intensity: {DC: 0.35, H2 pipeline: 0.422}
