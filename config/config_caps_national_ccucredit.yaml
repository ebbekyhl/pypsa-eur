# caps_national_ccucredit: the national caps of caps_national without the border rules
# for carbon carriers. A country keeps the credit for the CO2 it captures wherever
# the CO2 goes, including CO2 used in fuels abroad, and methanol carries no carbon
# across borders. No border adjustment. National caps from 2030 only; the run starts from the solved 2025 network of
# caps_continental (staged by job_x_stage.sh).
# Run it on top of config.caps.yaml.
run:
  name: "caps_national_ccucredit"
local_co2:
  AL: &caps {2030: 0.45, 2035: 0.25, 2040: 0.10, 2045: 0.05, 2050: 0.0}
  AT: *caps
  BA: *caps
  BE: *caps
  BG: *caps
  CH: *caps
  CZ: *caps
  DE: *caps
  DK: *caps
  EE: *caps
  ES: *caps
  FI: *caps
  FR: *caps
  GB: *caps
  GR: *caps
  HR: *caps
  HU: *caps
  IE: *caps
  IT: *caps
  LT: *caps
  LU: *caps
  LV: *caps
  ME: *caps
  MK: *caps
  NL: *caps
  'NO': *caps
  PL: *caps
  PT: *caps
  RO: *caps
  RS: *caps
  SE: *caps
  SI: *caps
  SK: *caps
