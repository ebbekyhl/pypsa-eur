# Same as config_cbam.yaml except that the per-class copies of each DC link are
# independent cables (no joint transmission capacity constraint): the transfer
# capability and the investment cost of every interconnector are multiplied by
# the number of classes. Storage and H2 still share capacity. Between myopic
# horizons the largest class copy's capacity is carried for every class (an
# approximation, as the network between rules is unsplit).
# Only meaningful as a comparison against config_cbam.yaml.
# Overlay on config/config.default.yaml.

run:
  name: "CBAM_noconstraint"

uk_settings:
  prepare:
    cbam: true
    cbam_shared_transmission_capacity: false
    cbam_regions: ["GB"]
    cbam_price: 90  # EUR/tCO2
    cbam_emission_transfer: import_only
