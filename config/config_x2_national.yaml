# x2: the same budget as x1, split into national caps: every country may emit the
# same fraction of its own 1990 CO2 (0.45 / 0.25 / 0.10 / 0.05 / 0 in 2030-2050).
# 2025 is loose (2.0, binding nowhere: the 2025 fleet is largely frozen, and Norway
# emits 1.5 times its 1990 CO2 in the model's 2025). No border adjustment. Run it
# on top of config.split.yaml.
run:
  name: "x2_national"
local_co2:
  AL: &caps {2025: 2.0, 2030: 0.45, 2035: 0.25, 2040: 0.10, 2045: 0.05, 2050: 0.0}
  AT: *caps
  BA: *caps
  BE: *caps
  BG: *caps
  CH: *caps
  CZ: *caps
  DE: *caps
  DK: *caps
  EE: *caps
  ES: *caps
  FI: *caps
  FR: *caps
  GB: *caps
  GR: *caps
  HR: *caps
  HU: *caps
  IE: *caps
  IT: *caps
  LT: *caps
  LU: *caps
  LV: *caps
  ME: *caps
  MK: *caps
  NL: *caps
  'NO': *caps
  PL: *caps
  PT: *caps
  RO: *caps
  RS: *caps
  SE: *caps
  SI: *caps
  SK: *caps
