# HVC policy instrument sweeps, temporary-support variant.
#
# Subsidies ramp down linearly and end after 2040 (full rate 2030, two thirds
# 2035, one third 2040, nothing from 2045). This treats them as transitional
# support for a technology transition rather than permanent operating aid, and
# matches how real instruments are written -- Klimaschutzvertraege run 15 years,
# 45Q runs 12.
#
# Fleet retention is a fixed-term bridge: full rate in 2030 and 2035, nothing
# afterwards. It buys time for the incumbent fleet, it does not underwrite it.
#
# Trade instruments (tariff, local content) are held constant, since they are
# not subsidies and a border measure would not normally sunset.
#
# Levels are set ex ante. The three EUR/MWh_HVC instruments share one ladder so
# that differences reflect the point of intervention, not the magnitude:
#   5  EUR/MWh
#   15 EUR/MWh
#   40 EUR/MWh
# Capex spans typical (30 %) and maximum (70 %) European aid intensities, plus
# 100 % as a bounding case. Local content is named by minimum domestic share.

# --- baseline: CBAM, every instrument off ---------------------------------

reference:
  industry:
    max_import_share:
      ethylene:  {2025: null, 2030: null, 2035: null, 2040: null, 2045: null, 2050: null}
      propylene: {2025: null, 2030: null, 2035: null, 2040: null, 2045: null, 2050: null}
      butadiene: {2025: null, 2030: null, 2035: null, 2040: null, 2045: null, 2050: null}
      aromatics: {2025: null, 2030: null, 2035: null, 2040: null, 2045: null, 2050: null}
    hvc_import_tariff:         {2025: 0, 2030: 0, 2035: 0, 2040: 0, 2045: 0, 2050: 0}
    hvc_capex_subsidy:         {2025: 0, 2030: 0, 2035: 0, 2040: 0, 2045: 0, 2050: 0}
    hvc_opex_subsidy:          {2025: 0, 2030: 0, 2035: 0, 2040: 0, 2045: 0, 2050: 0}
    hvc_existing_opex_subsidy: {2025: 0, 2030: 0, 2035: 0, 2040: 0, 2045: 0, 2050: 0}

# --- 1. fleet retention, EUR/MWh_HVC, fixed term to 2035 -----------------

fleet-05:
  industry:
    hvc_existing_opex_subsidy: {2025: 0, 2030: 5, 2035: 5, 2040: 0, 2045: 0, 2050: 0}

fleet-15:
  industry:
    hvc_existing_opex_subsidy: {2025: 0, 2030: 15, 2035: 15, 2040: 0, 2045: 0, 2050: 0}

fleet-40:
  industry:
    hvc_existing_opex_subsidy: {2025: 0, 2030: 40, 2035: 40, 2040: 0, 2045: 0, 2050: 0}

# --- 2. opex support for new build, EUR/MWh_HVC, ramped to zero by 2045 ---

opex-05:
  industry:
    hvc_opex_subsidy: {2025: 0, 2030: 5, 2035: 3.3, 2040: 1.7, 2045: 0, 2050: 0}

opex-15:
  industry:
    hvc_opex_subsidy: {2025: 0, 2030: 15, 2035: 10.0, 2040: 5.0, 2045: 0, 2050: 0}

opex-40:
  industry:
    hvc_opex_subsidy: {2025: 0, 2030: 40, 2035: 26.7, 2040: 13.3, 2045: 0, 2050: 0}

# --- 3. capex support, share of annualised capital cost waived ------------

capex-30:
  industry:
    hvc_capex_subsidy: {2025: 0, 2030: 0.30, 2035: 0.20, 2040: 0.10, 2045: 0, 2050: 0}

capex-70:
  industry:
    hvc_capex_subsidy: {2025: 0, 2030: 0.70, 2035: 0.467, 2040: 0.233, 2045: 0, 2050: 0}

# bounding case, not a policy level: capital cost removed entirely and held,
# to test whether capital cost is a binding barrier at all. Excluded from the
# capex ladder in the cost-effectiveness figure.
capex-100:
  industry:
    hvc_capex_subsidy: {2025: 0, 2030: 1.00, 2035: 1.00, 2040: 1.00, 2045: 1.00, 2050: 1.00}

# --- 4. import tariff, EUR/MWh, held constant ----------------------------

tariff-05:
